<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f7f6f2" />

    <title>Kagoj — Bangladesh News Directory</title>
    <meta
      name="description"
      content="Discover Bangladeshi newspapers, online news portals, e-papers, TV channels, English dailies and international publications in one organised directory."
    />
    <meta
      name="keywords"
      content="Bangladeshi newspapers, Bangla newspapers, Bangladesh news, e-paper, English newspapers Bangladesh, Bangladeshi TV channels, all Bangla newspaper"
    />
    <meta name="author" content="Kagoj" />
    <meta name="robots" content="index, follow" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kagoj" />
    <meta property="og:title" content="Kagoj — Bangladesh News Directory" />
    <meta
      property="og:description"
      content="Every Bangladeshi newspaper, one place. Browse newspapers, online news portals, e-papers, TV channels and international publications."
    />
    <meta property="og:locale" content="en_BD" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kagoj — Bangladesh News Directory" />
    <meta
      name="twitter:description"
      content="Every Bangladeshi newspaper, one place. A clean, searchable directory of the country's news publications."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Kagoj",
        "alternateName": "Kagoj — Bangladesh News Directory",
        "description": "A curated directory of Bangladeshi newspapers, online news portals, e-papers, TV channels and international publications.",
        "inLanguage": "en",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
